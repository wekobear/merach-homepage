<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERACH — Mobile Preview (390px)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1b2230 0%, #0d1016 70%);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px 32px;
      gap: 16px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 12px;
      border-radius: 6px;
      backdrop-filter: blur(12px);
    }
    .toolbar-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-right: 6px;
    }
    .pill-btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .pill-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }
    .pill-btn.is-active {
      background: #14C3FF;
      border-color: #14C3FF;
      color: #05070a;
      font-weight: 600;
    }
    .phone-frame {
      position: relative;
      padding: 12px;
      border-radius: 46px;
      background: linear-gradient(145deg, #2a2f3a 0%, #11141a 100%);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.16);
      transition: width 0.28s ease;
    }
    .phone-screen {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 36px;
      overflow: hidden;
      background: #000000;
      display: flex;
      flex-direction: column;
      transition: width 0.28s ease, height 0.28s ease;
    }
    .phone-statusbar {
      height: 36px;
      flex-shrink: 0;
      background: #0b0d11;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      position: relative;
    }
    .phone-island {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 22px;
      border-radius: 999px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title">MERACH 移动端预览</span>
    <button type="button" class="pill-btn is-active" data-w="390" data-h="844">iPhone 390×844</button>
    <button type="button" class="pill-btn" data-w="430" data-h="932">Pro Max 430×932</button>
    <button type="button" class="pill-btn" data-w="375" data-h="812">SE / Mini 375×812</button>
    <a href="./index.html" class="pill-btn">切换回桌面端 →</a>
  </div>

  <div class="phone-frame">
    <div class="phone-screen" id="phoneScreen">
      <div class="phone-statusbar" aria-hidden="true">
        <span>9:41</span>
        <div class="phone-island"></div>
        <span>5G 100%</span>
      </div>
      <iframe src="./index.html" title="MERACH Mobile Preview"></iframe>
    </div>
  </div>

  <script>
    const screen = document.getElementById("phoneScreen");
    const btns = document.querySelectorAll(".pill-btn[data-w]");
    btns.forEach((btn) => {
      btn.addEventListener("click", () => {
        btns.forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        screen.style.width = btn.dataset.w + "px";
        screen.style.height = btn.dataset.h + "px";
      });
    });
  </script>
</body>
</html>
